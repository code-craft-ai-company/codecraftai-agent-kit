[tool.poetry]
name = "codecraftai-agent-kit"
description = "Code Craft AI - Agent Kit"
version = "1.0.0"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-arcli = { version = "<2.0.0", source = "codecraftai" }
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-extension = { version = "<2.0.0", source = "codecraftai" }
pyyaml = "^6.0.1"
msgpack = { version = "^1.0.0", optional = true }
protobuf = { version = "^4.21.0", optional = true }

[tool.poetry.extras]
msgpack = ["msgpack"]
protobuf = ["protobuf"]
serialization = ["msgpack", "protobuf"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }
codecraftai-xmodules = { version = "<2.0.0", source = "codecraftai" }


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
